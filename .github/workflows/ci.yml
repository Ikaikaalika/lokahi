name: ci

# GitHub-hosted runners only. They cannot execute Metal compute or the ANE,
# so this workflow proves portable correctness and that the Apple sources
# compile; hardware evidence comes from apple-silicon.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy pytest tokenizers==0.23.3
      - name: Build native engine
        run: |
          cmake -S native/engine -B build/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine -j 4
      - name: Native unit tests
        run: ./build/engine/lokahi_engine_tests
      - name: Metal syntax check (stubbed, no Apple SDK)
        run: CXX=clang++ native/engine/tests/syntax_check.sh
      - name: Python tests (CPU engine vs NumPy oracle)
        env:
          LOKAHI_NATIVE_BUILD_DIR: build/engine
        run: PYTHONPATH=src python -m pytest -q
      - name: Bytecode compile gate
        run: PYTHONPATH=src python -m compileall -q src tests benchmarks

  macos-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build native engine with Metal
        run: |
          cmake -S native/engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DLOKAHI_METAL=ON
          cmake --build build/engine -j 4
      - name: Native unit tests
        run: ./build/engine/lokahi_engine_tests
      - name: Compile Metal kernels with xcrun
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          xcrun -sdk macosx metal -std=metal3.0 -Werror -c native/engine/src/metal/decoder_kernels.metal -o build/decoder_kernels.air
          xcrun -sdk macosx metallib build/decoder_kernels.air -o build/decoder_kernels.metallib
      - name: Build ANE probe
        run: make -C native/ane
      - name: CPU engine, tokenizer and C ABI vs oracles
        env:
          LOKAHI_NATIVE_BUILD_DIR: build/engine
        run: |
          python3 -m venv .venv
          .venv/bin/pip install numpy pytest tokenizers==0.23.3
          PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_native_engine.py tests/test_gemma3_vision.py tests/test_gemma4_vision.py tests/test_tokenizer.py tests/test_tokenizer_bytelevel.py tests/test_c_abi.py tests/test_sampling.py
      - name: Metal backend vs oracles (when the runner exposes a Metal device)
        env:
          LOKAHI_NATIVE_BUILD_DIR: build/engine
        run: |
          # Correctness evidence only: hosted runners are virtual machines, so
          # nothing here is a throughput number. A runner without a Metal
          # device skips; any other Metal failure fails the step.
          PYTHONPATH=src .venv/bin/python -c 'import sys; from lokahi.fixtures import write_tiny_gemma3; write_tiny_gemma3(sys.argv[1])' build/metal-probe
          if ! ./build/engine/lokahi info --model build/metal-probe --backend metal 2>build/metal-probe.err; then
            cat build/metal-probe.err
            if grep -q "no Metal device" build/metal-probe.err; then
              echo "::notice::this runner exposes no Metal device; Metal execution stays on the self-hosted Mac"
              exit 0
            fi
            exit 1
          fi
          system_profiler SPDisplaysDataType | sed -n '1,20p'
          LOKAHI_TEST_BACKENDS=metal PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_native_engine.py tests/test_gemma3_vision.py tests/test_gemma4_vision.py \
            tests/test_qwen35_vision.py tests/test_qwen3_vl.py tests/test_qwen2_5_vl.py tests/test_sampling.py
      - name: Oracles vs MLX, MLX-LM, MLX-VLM and Transformers (independent implementations)
        run: |
          # Correctness evidence: the NumPy oracles against MLX-LM's and
          # MLX-VLM's models in float32, and Transformers' image processor. A
          # separate venv keeps their dependencies away from the pinned
          # tokenizers the other steps use. MLX-VLM goes in without its
          # server and dataset dependencies, which the models never import.
          python3 -m venv .venv-mlx
          .venv-mlx/bin/pip install numpy pytest Pillow requests mlx==0.32.3 mlx-metal==0.32.3 mlx-lm==0.32.0 \
            transformers==5.20.0
          .venv-mlx/bin/pip install --no-deps mlx-vlm==0.4.4
          .venv-mlx/bin/python -c 'import mlx.core, mlx_lm, mlx_vlm.utils'  # the tests skip without them; here they must run
          PYTHONPATH=src .venv-mlx/bin/python -m pytest -q -rs tests/test_mlx_crosscheck.py tests/test_mlx_vlm_crosscheck.py
          # Qwen3.5's MTP head against MLX-VLM's qwen3_5_mtp drafter, which
          # 0.4.4 predates; the newer release replaces it for this test only.
          .venv-mlx/bin/pip install --no-deps mlx-vlm==0.7.8
          .venv-mlx/bin/python -c 'import mlx_vlm.speculative.drafters.qwen3_5_mtp'
          PYTHONPATH=src .venv-mlx/bin/python -m pytest -q -rs tests/test_mlx_vlm_mtp_crosscheck.py
      - name: Wire v1 service across a real XPC boundary (gate B, CPU backend)
        run: |
          PYTHONPATH=src .venv/bin/python -c 'import sys; from lokahi.fixtures import write_tiny_chat_model; write_tiny_chat_model(sys.argv[1])' build/xpc-model
          cat > build/xpc-config.json <<JSON
          {"models": [{"id": "tiny-gemma3", "revision": "$(printf 'a%.0s' $(seq 40))",
                       "artifact_digest": "sha256:$(printf 'b%.0s' $(seq 64))", "adapter_id": "gemma3",
                       "directory": "$PWD/build/xpc-model"}],
           "backend": "cpu", "max_context": 4600, "text_flush_ms": 0,
           "runtime_revision": "$(printf '1%.0s' $(seq 64))"}
          JSON
          LOKAHI_XPC_TEST_CONFIG="$PWD/build/xpc-config.json" swift test --package-path integrations/commoncompute \
            -Xlinker -L"$PWD/build/engine" -Xlinker -rpath -Xlinker "$PWD/build/engine"

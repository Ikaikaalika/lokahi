[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lokahi"
version = "0.6.0"
description = "Memory-tiered LLM inference for Apple Silicon"
authors = [
  { name="Common Compute LLC", email="support@commoncompute.ai" }
]
readme = "README.md"
license = { file="LICENSE" }
classifiers = [
  "License :: Free for non-commercial use",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "transformers>=4.55.0", #tested: 4.55.4, 4.56.1
    "huggingface-hub",
    "requests",
    "mlx>=0.23.0",
    "mlx-lm>=0.22.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/Ikaikaalika/lokahi"
"Bug Tracker" = "https://github.com/Ikaikaalika/lokahi/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
